---
# tasks file for nginx
- name: Install a list of packages
  tags: install_cryptography
  ansible.builtin.apt:
    update_cache: yes
    state: present
    name: python3-cryptography=43.0.0-3+deb13u1
    
- name: Create private key (RSA, 4096 bits)
  community.crypto.openssl_privatekey:
    path: /var/certificate.key

- name: Create certificate signing request (CSR) for self-signed certificate
  community.crypto.openssl_csr_pipe:
    privatekey_path: /var/certificate.key
    common_name: cloudone42.duckdns.org
    organization_name: Ansible, Inc.
    subject_alt_name:
      - "DNS:cloudone42.duckdns.org"
  register: csr

- name: Create self-signed certificate from CSR
  community.crypto.x509_certificate:
    path: /var/certificate.pem
    csr_content: "{{ csr.csr }}"
    privatekey_path: /var/certificate.key
    provider: selfsigned

- name: Copiar arquivo de configuração estático nginx
  ansible.builtin.copy:
    src: wordpress_nginx.conf
    dest: /var/wordpress_nginx.conf
    mode: '0600'
  tags: nginx_config


- name: Copiar arquivo de configuração estático php_fpm
  ansible.builtin.copy:
    src: docker.conf
    dest: /var/docker.conf
    mode: '0600'
  tags: php_fpm_config

- name: Start nginx compose service
  community.docker.docker_compose_v2:
    services:
      - nginx
    state: present
    project_src: "{{ project_folder_remote_host }}"
    files:
      - compose.yml
  tags: start_nginx
