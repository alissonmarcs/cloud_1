---
- name: Install UFW package
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set default firewall policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Limit SSH access to prevent brute-force attacks
  community.general.ufw:
    rule: limit
    port: '22'
    proto: tcp

- name: Allow incoming HTTP and HTTPS traffic
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '80'
    - '443'

- name: Enable UFW and ensure it persists across reboots
  community.general.ufw:
    state: enabled
