server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cloudone42.duckdns.org;

    ssl_certificate_key /var/certificate.key;
    ssl_certificate /var/certificate.pem;
    ssl_protocols TLSv1.3;

    # WordPress: arquivos públicos
    root /var/www/html;
    index index.php;

    # phpMyAdmin: normaliza a URL
    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    # phpMyAdmin: arquivos estáticos
    location /phpmyadmin/ {
        alias /var/www/php_my_admin/;
        index index.php;
        try_files $uri $uri/ =404;
    }

    # PHP do phpMyAdmin
    location ~ ^/phpmyadmin/(.+\.php)$ {
        include fastcgi_params;

        # Caminho dentro do container phpMyAdmin
        fastcgi_param SCRIPT_FILENAME /var/www/html/$1;

        fastcgi_pass phpmyadmin:9000;
    }

    # WordPress: Front Controller
    location / {
        try_files $uri $uri/ /index.php;
    }

    # PHP do WordPress
    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_pass wordpress_php_fpm:9000;
    }
}

