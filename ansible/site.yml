---

- name: Run using a project directory
  hosts: debian
  gather_facts: true
  become: true
  become_method: sudo

  vars:
    project_folder_remote_host: "/home/{{ ansible_user }}/cloud_1/"
    docker_users: 
      - "{{ ansible_user }}"


  roles:
    - {role: geerlingguy.docker, tags: install_docker }
    - {role: wordpress, tags: wordpress}
    - ufw
    - {role: duckdns, tags: get_public_ip}
